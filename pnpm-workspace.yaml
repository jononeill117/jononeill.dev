packages:
  - "apps/*"
  - "packages/*"
# pnpm blocks postinstall scripts by default. All three of these need theirs:
#   esbuild  downloads its platform binary. Vite and Astro will not build without it.
#   workerd  the Cloudflare runtime binary. wrangler dev cannot start without it.
#   sharp    Astro's image pipeline.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Root package.json pins wrangler exactly at 4.151.3 (WS3, 2026-10-22):
# 4.152.0 was published the same day and trips pnpm's minimumReleaseAge
# supply-chain policy on every run. Move back to a ^ range once 4.152+
# is past the release-age cutoff.
# Security overrides (WS3, 2026-10-22): patch-level bumps for transitive pins
# that the latest Astro/wrangler chains still resolve below their OSV fixes.
#   undici 8.10.0 -> 8.10.2 (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-vp8m-p9jh-q5pm)
#   fast-uri 3.1.6 -> 3.1.8 (GHSA-58mr-gqgx-xq4g, GHSA-qw65-cvwx-89v3, GHSA-hrr3-gc8f-f4qj)
#   source-map-js 1.2.1 -> 1.2.2 (GHSA-68fv-2mgg-jv7q)
overrides:
  "undici@8.10.0": "8.10.2"
  "fast-uri@3.1.6": "3.1.8"
  "source-map-js@1.2.1": "1.2.2"
