      - article [ref=e218]:
        - paragraph [ref=e219]: Side project · Dec 2025 to Present
        - heading [level=3] [ref=e220]:
          - link "Ecclesio" [ref=e221] [cursor=pointer]:
            - /url: "#ecclesio"
        - paragraph [ref=e222]: A side project I build because I like building products. Invite-only, and it stays a side project.
        - paragraph [ref=e223]: Zero to beta in four months · Dashboard 2s → ~50ms · Isolated databases · Tokenized payments
        - generic [ref=e224]:
          - paragraph [ref=e225]:
            - strong [ref=e226]: Problem.
            - text: I wanted to know whether I could still take a product from nothing to beta without a company behind me. Church software was the excuse. It is a side project and it stays one.
          - paragraph [ref=e227]:
            - strong [ref=e228]: What I owned.
            - text: All of it. I directed a contract engineering team through the first build, then took over as the only person maintaining it.
          - paragraph [ref=e229]:
            - strong [ref=e230]: What shipped.
            - text: Zero to beta in four months. A per-church isolated database, so no church's records share a table with another church's. Tokenized payments, so the app never holds a card number. A dashboard that loads in about 50ms where the first build took two seconds. Churches join by invitation only, so there is no public directory to browse.
          - paragraph [ref=e231]:
            - strong [ref=e232]: Who I worked with.
            - text: A contract engineering team on the first build. After that, me, plus the church staff running the beta.
          - paragraph [ref=e233]:
            - strong [ref=e234]: Result.
            - text: Zero to beta in four months. Dashboard load down from two seconds to about 50ms.
