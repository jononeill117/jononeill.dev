      - list [ref=e59]:
        - listitem [ref=e60]:
          - paragraph [ref=e61]: Director of Operations · 2023 to Present
          - heading [level=3] [ref=e62]:
            - link "Zoom Drain Phoenix" [ref=e63] [cursor=pointer]:
              - /url: "#zoom-drain"
          - paragraph [ref=e64]: I run the operating system behind a live service business. Dispatch, intake, vendors, the office team, and the number at the bottom. The job is automation and pricing discipline pointed at a P&L, not a title on a truck.
          - paragraph [ref=e65]: Booking time down 3 hours · Speed to lead up 300% · Weekly revenue up 10-15% · Office labor down ~30%
          - generic [ref=e66]:
            - paragraph [ref=e67]:
              - strong [ref=e68]: Problem.
              - text: Jobs were dying in the gap between the vendor portal, the inbox, and the board. Intake was a person. Estimating was a person. The calendar was setting the price.
            - paragraph [ref=e69]:
              - strong [ref=e70]: What I owned.
              - text: "Day to day operations: dispatch, job intake, vendor relationships, field teams, and the office team I hired and trained. The P&L all of it lands on."
            - paragraph [ref=e71]:
              - strong [ref=e72]: What shipped.
              - text: "Intake rebuilt as an automated pipeline across the vendor work-order portal, the CSM, and VOIP. Scheduling and booking automated so the office is not the bottleneck. SOPs for inventory and estimating, so a new hire can quote without a month of shadowing. Marketing spend pointed at our own booking and revenue data. Commercial work the company was not set up to quote: sewer laterals, multi-crew renovation jobs."
            - paragraph [ref=e73]:
              - strong [ref=e74]: Who I worked with.
              - text: The office team, which I hired and trained. Field technicians. National vendors on the intake side. Gary on CSM review and Steve in the office when a job needed a human in the loop.
            - paragraph [ref=e75]:
              - strong [ref=e76]: Result.
              - text: Average booking time down three hours. Speed to lead up 300%. Weekly revenue up 10 to 15%. Office labor down about 30%, close to $40k a year. $711k annual run rate, January through July 2026 annualized.
            - paragraph [ref=e77]: This is the seat that changed how I write a roadmap. When you own the number at the bottom, you stop shipping work that only looks good in a review.
            - figure "See the operating system in action" [ref=e78]:
              - paragraph [ref=e79]:
                - generic [ref=e80]: System
                - generic [ref=e81]: Vendor intake → automation → dispatch
              - paragraph [ref=e82]: Watch a work order move from the vendor portal to a tech on a truck.
              - button "Play the walkthrough" [ref=e85] [cursor=pointer]
        - listitem [ref=e92]:
          - paragraph [ref=e93]: Head of Product · Sep 2023 to Jul 2024
          - heading [level=3] [ref=e94]:
            - link "Livable" [ref=e95] [cursor=pointer]:
              - /url: "#livable"
          - paragraph [ref=e96]: A zero to one SaaS. I hired the team, shipped the product, and took it to the board every month.
          - paragraph [ref=e97]: 2,000 units in the first four months. CSAT and retention up 35%.
          - generic [ref=e98]:
            - paragraph [ref=e99]:
              - strong [ref=e100]: Problem.
              - text: "Livable had reach and no product of its own to sell into it. The brief was zero to one: build something new, get it live, and get real units onto it fast, with a channel behind it that would keep feeding it after launch."
            - paragraph [ref=e101]:
              - strong [ref=e102]: What I owned.
              - text: The product, from the first requirements doc to the roadmap the board saw every month. I also owned the team, because there wasn't one yet. I hired the product managers, the designers, and the business analysts who built it with me.
            - paragraph [ref=e103]:
              - strong [ref=e104]: What shipped.
              - text: A SaaS product from nothing to live and taking accounts. An enterprise integration that put it in front of an 8M-unit base on an evergreen basis rather than as a one-time push. A roadmap built out of what users said in interviews and support tickets instead of out of the loudest internal request.
            - paragraph [ref=e105]:
              - strong [ref=e106]: Who I worked with.
              - text: "Engineering, design, sales, and support on the inside. Enterprise property management on the outside. The board monthly, which is a useful discipline: you cannot bring a story to a board four times, so you bring the number."
            - paragraph [ref=e107]:
              - strong [ref=e108]: Result.
              - text: 2,000 units in the first four months. CSAT and retention up 35% once the feedback-driven roadmap started landing.
            - figure "Interactive walkthrough" [ref=e109]:
              - paragraph [ref=e110]:
                - generic [ref=e111]: System
                - generic [ref=e112]: Billing → allocation → payment
              - paragraph [ref=e113]: Watch a utility bill get split across units, then paid. Then toggle landlord / resident.
              - button "Play the walkthrough" [ref=e116] [cursor=pointer]
        - listitem [ref=e123]:
          - paragraph [ref=e124]: Senior Product Manager, SaaS and Data Integrations · May 2022 to Jul 2023
          - heading [level=3] [ref=e125]:
            - link "Stoa" [ref=e126] [cursor=pointer]:
              - /url: "#stoa"
          - paragraph [ref=e127]: Owned Portico, the underwriting platform forty analysts worked in, and rebuilt what it cost the company to say yes to a house.
          - paragraph [ref=e128]: $1B underwritten, $300M purchased. Cycle time down 85%.
          - generic [ref=e129]:
            - paragraph [ref=e130]:
              - strong [ref=e131]: Problem.
              - text: Underwriting a house took too long and took too many people. Forty analysts worked across twenty-two vendor feeds to decide what to pay, and at that speed the calendar was setting the price instead of the model.
            - paragraph [ref=e132]:
              - strong [ref=e133]: What I owned.
              - text: Portico, the platform those forty analysts underwrote in. The data integrations feeding it and the automation sitting on top of it.
            - paragraph [ref=e134]:
              - strong [ref=e135]: What shipped.
              - text: One queue in place of a pile of tools. Vendor consolidation from twenty-two down to six, which cut both the bill and the number of ways a feed could break. Machine learning and automation on the steps that were only ever going to repeat, absorbing up to $4M in labor.
            - paragraph [ref=e136]:
              - strong [ref=e137]: Who I worked with.
              - text: Forty analysts as my users, daily, which is the best product feedback loop I have had. Engineering and data on the build. Vendors on the way out.
            - paragraph [ref=e138]:
              - strong [ref=e139]: Result.
              - text: $1B underwritten and $300M purchased through the platform. Cycle time down 85%. Integration time down 40% and data accuracy up 25%.
            - figure "Interactive walkthrough" [ref=e140]:
              - paragraph [ref=e141]:
                - generic [ref=e142]: System
                - generic [ref=e143]: Data → underwriting → decision
              - paragraph [ref=e144]: Open a Portico file. This is the queue 40 analysts worked.
