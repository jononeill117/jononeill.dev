          - paragraph [ref=e158]: The underwriting model behind Cash Close, and the automation that let it make offers without a person in the loop.
          - paragraph [ref=e159]: An $800M annual book. 300 automated offers a month.
          - generic [ref=e160]:
            - paragraph [ref=e161]:
              - strong [ref=e162]: Problem.
              - text: Cash Close promised a seller a cash offer quickly. Every offer needed a defensible number behind it, and one analyst pricing one house at a time does not get you to an $800M annual book.
            - paragraph [ref=e163]:
              - strong [ref=e164]: What I owned.
              - text: The underwriting model for Cash Close and the offer automation that ran on top of it.
            - paragraph [ref=e165]:
              - strong [ref=e166]: What shipped.
              - text: A model that priced the offer and a pipeline that sent it without waiting on an analyst. The model carried the book; the automation carried the volume.
            - paragraph [ref=e167]:
              - strong [ref=e168]: Who I worked with.
              - text: Acquisitions on the inputs and on what a seller would actually accept. Engineering and data science on the model and the production path.
            - paragraph [ref=e169]:
              - strong [ref=e170]: Result.
              - text: An $800M annual book underwritten on the model. 300 automated offers a month.
