    - generic [ref=e250]:
      - paragraph [ref=e251]: About
      - heading "Models, then platforms, then a P&L." [level=2] [ref=e252]
      - paragraph [ref=e253]: I am a product leader. I like the problems where the answer is a number.
      - generic [ref=e254]:
        - paragraph [ref=e255]: "I started at Zillow in 2019, my first enterprise product seat, on underwriting and AI models that ran every day on inventory the company was buying. That is where I learned a model is a product: it has users, it has a latency budget, and when it is wrong somebody answers for it."
        - paragraph [ref=e256]: "HomeLight was the same lesson at higher stakes: the underwriting model behind Cash Close and the automation that sent 300 offers a month against an $800M book. Stoa was the platform version. Portico, forty analysts, cycle time down 85%, twenty-two vendor feeds down to six."
        - paragraph [ref=e257]: "Livable was the one I had been building toward. Head of Product on a zero to one SaaS: hire the team, ship the product, take it to the board monthly, 2,000 units in four months."
        - paragraph [ref=e258]: Then I applied product and systems thinking to a live operating business at Zoom Drain Phoenix. Dispatch, intake, an office I hired, a P&L I had to live with. It taught me what my old roadmaps cost the people downstream.
        - paragraph [ref=e259]: Open to startups and to established companies that move with a sense of urgency. Phoenix, AZ, and glad to work remote.
