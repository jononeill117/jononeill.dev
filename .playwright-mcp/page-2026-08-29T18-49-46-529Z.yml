      - list [ref=f1e59]:
        - listitem [ref=f1e60]:
          - paragraph [ref=f1e61]: Director of Operations · 2023 to Present
          - heading [level=3] [ref=f1e62]:
            - link "Zoom Drain Phoenix" [ref=f1e63] [cursor=pointer]:
              - /url: "#zoom-drain"
          - paragraph [ref=f1e64]: I run the operating system behind a live service business. Dispatch, intake, vendors, the office team, and the number at the bottom. The job is automation and pricing discipline pointed at a P&L, not a title on a truck.
          - paragraph [ref=f1e65]: Booking time down 3 hours · Speed to lead up 300% · Weekly revenue up 10-15% · Office labor down ~30%
          - generic [ref=f1e66]:
            - paragraph [ref=f1e67]:
              - strong [ref=f1e68]: Problem.
              - text: Jobs were dying in the gap between the vendor portal, the inbox, and the board. Intake was a person. Estimating was a person. The calendar was setting the price.
            - paragraph [ref=f1e69]:
              - strong [ref=f1e70]: What I owned.
              - text: "Day to day operations: dispatch, job intake, vendor relationships, field teams, and the office team I hired and trained. The P&L all of it lands on."
            - paragraph [ref=f1e71]:
              - strong [ref=f1e72]: What shipped.
              - text: "Intake rebuilt as an automated pipeline across the vendor work-order portal, the CSM, and VOIP. Scheduling and booking automated so the office is not the bottleneck. SOPs for inventory and estimating, so a new hire can quote without a month of shadowing. Marketing spend pointed at our own booking and revenue data. Commercial work the company was not set up to quote: sewer laterals, multi-crew renovation jobs."
            - paragraph [ref=f1e73]:
              - strong [ref=f1e74]: Who I worked with.
              - text: The office team, which I hired and trained. Field technicians. National vendors on the intake side. Gary on CSM review and Steve in the office when a job needed a human in the loop.
            - paragraph [ref=f1e75]:
              - strong [ref=f1e76]: Result.
              - text: Average booking time down three hours. Speed to lead up 300%. Weekly revenue up 10 to 15%. Office labor down about 30%, close to $40k a year. $711k annual run rate, January through July 2026 annualized.
            - paragraph [ref=f1e77]: This is the seat that changed how I write a roadmap. When you own the number at the bottom, you stop shipping work that only looks good in a review.
            - figure "See the operating system in action" [ref=f1e78]:
              - paragraph [ref=f1e79]:
                - generic [ref=f1e80]: System
                - generic [ref=f1e81]: Vendor intake → automation → dispatch
              - paragraph [ref=f1e82]: Watch a work order move from the vendor portal to a tech on a truck.
              - button "Play the walkthrough" [ref=f1e85] [cursor=pointer]
        - listitem [ref=f1e92]:
          - paragraph [ref=f1e93]: Head of Product · Sep 2023 to Jul 2024
          - heading [level=3] [ref=f1e94]:
            - link "Livable" [ref=f1e95] [cursor=pointer]:
              - /url: "#livable"
          - paragraph [ref=f1e96]: A zero to one SaaS. I hired the team, shipped the product, and took it to the board every month.
          - paragraph [ref=f1e97]: 2,000 units in the first four months. CSAT and retention up 35%.
          - generic [ref=f1e98]:
            - paragraph [ref=f1e99]:
              - strong [ref=f1e100]: Problem.
              - text: "Livable had reach and no product of its own to sell into it. The brief was zero to one: build something new, get it live, and get real units onto it fast, with a channel behind it that would keep feeding it after launch."
            - paragraph [ref=f1e101]:
              - strong [ref=f1e102]: What I owned.
              - text: The product, from the first requirements doc to the roadmap the board saw every month. I also owned the team, because there wasn't one yet. I hired the product managers, the designers, and the business analysts who built it with me.
            - paragraph [ref=f1e103]:
              - strong [ref=f1e104]: What shipped.
              - text: A SaaS product from nothing to live and taking accounts. An enterprise integration that put it in front of an 8M-unit base on an evergreen basis rather than as a one-time push. A roadmap built out of what users said in interviews and support tickets instead of out of the loudest internal request.
            - paragraph [ref=f1e105]:
              - strong [ref=f1e106]: Who I worked with.
              - text: "Engineering, design, sales, and support on the inside. Enterprise property management on the outside. The board monthly, which is a useful discipline: you cannot bring a story to a board four times, so you bring the number."
            - paragraph [ref=f1e107]:
              - strong [ref=f1e108]: Result.
              - text: 2,000 units in the first four months. CSAT and retention up 35% once the feedback-driven roadmap started landing.
            - figure "Interactive walkthrough" [ref=f1e109]:
              - paragraph [ref=f1e110]:
                - generic [ref=f1e111]: System
                - generic [ref=f1e112]: Billing → allocation → payment
              - paragraph [ref=f1e113]: Watch a utility bill get split across units, then paid. Then toggle landlord / resident.
              - button "Play the walkthrough" [ref=f1e116] [cursor=pointer]
        - listitem [ref=f1e123]:
          - paragraph [ref=f1e124]: Senior Product Manager, SaaS and Data Integrations · May 2022 to Jul 2023
          - heading [level=3] [ref=f1e125]:
            - link "Stoa" [ref=f1e126] [cursor=pointer]:
              - /url: "#stoa"
          - paragraph [ref=f1e127]: Owned Portico, the underwriting platform forty analysts worked in, and rebuilt what it cost the company to say yes to a house.
          - paragraph [ref=f1e128]: $1B underwritten, $300M purchased. Cycle time down 85%.
          - generic [ref=f1e129]:
            - paragraph [ref=f1e130]:
              - strong [ref=f1e131]: Problem.
              - text: Underwriting a house took too long and took too many people. Forty analysts worked across twenty-two vendor feeds to decide what to pay, and at that speed the calendar was setting the price instead of the model.
            - paragraph [ref=f1e132]:
              - strong [ref=f1e133]: What I owned.
              - text: Portico, the platform those forty analysts underwrote in. The data integrations feeding it and the automation sitting on top of it.
            - paragraph [ref=f1e134]:
              - strong [ref=f1e135]: What shipped.
              - text: One queue in place of a pile of tools. Vendor consolidation from twenty-two down to six, which cut both the bill and the number of ways a feed could break. Machine learning and automation on the steps that were only ever going to repeat, absorbing up to $4M in labor.
            - paragraph [ref=f1e136]:
              - strong [ref=f1e137]: Who I worked with.
              - text: Forty analysts as my users, daily, which is the best product feedback loop I have had. Engineering and data on the build. Vendors on the way out.
            - paragraph [ref=f1e138]:
              - strong [ref=f1e139]: Result.
              - text: $1B underwritten and $300M purchased through the platform. Cycle time down 85%. Integration time down 40% and data accuracy up 25%.
            - figure "Interactive walkthrough" [ref=f1e140]:
              - paragraph [ref=f1e141]:
                - generic [ref=f1e142]: System
                - generic [ref=f1e143]: Data → underwriting → decision
              - paragraph [ref=f1e144]: Open a Portico file. This is the queue 40 analysts worked.
              - button "Play the walkthrough" [ref=f1e147] [cursor=pointer]
        - listitem [ref=f1e154]:
          - paragraph [ref=f1e155]: Product Owner, Acquisitions · Mar 2021 to May 2022
          - heading [level=3] [ref=f1e156]:
            - link "HomeLight" [ref=f1e157] [cursor=pointer]:
              - /url: "#homelight"
          - paragraph [ref=f1e158]: The underwriting model behind Cash Close, and the automation that let it make offers without a person in the loop.
          - paragraph [ref=f1e159]: An $800M annual book. 300 automated offers a month.
          - generic [ref=f1e160]:
            - paragraph [ref=f1e161]:
              - strong [ref=f1e162]: Problem.
              - text: Cash Close promised a seller a cash offer quickly. Every offer needed a defensible number behind it, and one analyst pricing one house at a time does not get you to an $800M annual book.
            - paragraph [ref=f1e163]:
              - strong [ref=f1e164]: What I owned.
              - text: The underwriting model for Cash Close and the offer automation that ran on top of it.
            - paragraph [ref=f1e165]:
              - strong [ref=f1e166]: What shipped.
              - text: A model that priced the offer and a pipeline that sent it without waiting on an analyst. The model carried the book; the automation carried the volume.
            - paragraph [ref=f1e167]:
              - strong [ref=f1e168]: Who I worked with.
              - text: Acquisitions on the inputs and on what a seller would actually accept. Engineering and data science on the model and the production path.
            - paragraph [ref=f1e169]:
              - strong [ref=f1e170]: Result.
              - text: An $800M annual book underwritten on the model. 300 automated offers a month.
            - figure "Interactive walkthrough" [ref=f1e171]:
              - paragraph [ref=f1e172]:
