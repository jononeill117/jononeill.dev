          - paragraph [ref=f1e189]: First enterprise product seat. Underwriting and AI models in production, running every day on inventory the company was buying.
          - paragraph [ref=f1e190]: About ten a day. About 3,000 in the period.
          - generic [ref=f1e191]:
            - paragraph [ref=f1e192]:
              - strong [ref=f1e193]: Problem.
              - text: Zillow was buying at volume and each of those decisions came out of a model. A model that runs every day is a product, and it needed somebody on the product side of it, sitting between the people running it and the people shipping it.
            - paragraph [ref=f1e194]:
              - strong [ref=f1e195]: What I owned.
              - text: My first enterprise product seat. Underwriting and AI models, day to day, in production rather than in a notebook.
            - paragraph [ref=f1e196]:
              - strong [ref=f1e197]: What shipped.
              - text: "Models that ran on live inventory at a pace the team could hold, every working day, for eighteen months. This is where I learned the thing I have used at every job since: a model has users, it has a latency budget, and when it is wrong somebody has to answer for it."
            - paragraph [ref=f1e198]:
              - strong [ref=f1e199]: Who I worked with.
